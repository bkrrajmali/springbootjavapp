apiVersion: apps/v1
kind: Deployment
metadata: 
    name: petclinic
spec:
    replicas: 2
    selector:
      matchlabels:
        app: petclinic
    template:
      metadata:
        labels:
          app: petclinic
      spec:
        imagePullSecrets:
          - name:  acr-secret
        containers:
          - name: petclinic
            image: democontainerregi.azurecr.io/springbootjavaapp:latest
            ports:
              - containerPort: 8080
